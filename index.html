<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">

<title>Mappa liquidità NEXUS</title>
<style>
:root{--bg:#1a2027;--panel:#232b34;--ln:#33404d;--fg:#d9e0e8;--mut:#8b9aab;--buy:#46d17b;--sell:#e5605a;--acc:#7cc4ff}

#c{touch-action:none;display:block;width:100%;height:calc(100% - 42px);cursor:crosshair}
#tip{position:fixed;pointer-events:none;background:#12171cee;border:1px solid var(--ln);border-radius:6px;padding:6px 8px;font-size:12px;display:none;white-space:pre;z-index:5}
#cp{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end;justify-content:center}#cp[hidden]{display:none}
.box{background:var(--panel);border:1px solid var(--ln);border-radius:12px 12px 0 0;padding:12px;width:min(720px,100%);max-height:92%;overflow:auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.box label{display:block;color:var(--mut);font-size:12px;margin:8px 0 4px}
.box textarea{width:100%;background:#12171c;color:var(--fg);border:1px solid var(--ln);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace}
.rw{display:flex;gap:10px;align-items:center;margin:10px 0 4px}.box small{color:var(--mut)}
@media(max-width:640px){#top h1{display:none}}
</style></head><body>
<div id="top"><h1>Mappa liquidità</h1><span class="t" id="tit"></span>
<button id="bCa" class="on">Candele</button><select id="sTf"><option value="15000">15 s</option><option value="60000" selected>1 min</option><option value="300000">5 min</option></select>
<button id="bBo" class="on">Bolle</button><button id="bVo" class="on">Volume</button>
<button id="bR">Vista intera</button><button id="bL">Live</button><button id="bC">Copia per Claude</button></div>
<canvas id="c"></canvas><div id="tip"></div>
<div id="cp" hidden><div class="box"><div class="hd"><b>Copia per Claude</b><button id="cpX">Chiudi</button></div>
<label>La tua lettura (cosa vedi e cosa pensi)</label><textarea id="cpN" rows="4" placeholder="es. muro grosso sull'ask, poco volume sotto, secondo me spinge giù; vorrei capire se regge"></textarea>
<label>Testo pronto da incollare nella chat (dati della finestra visibile)</label><textarea id="cpT" rows="9" readonly></textarea>
<div class="rw"><button id="cpC" class="on">Copia tutto</button><span id="cpM"></span></div>
<small>Poi incolla nella chat con Claude e aggiungi lo screenshot della mappa.</small></div></div>
<script src="dati_replay.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id),cv=$("c"),cx=cv.getContext("2d"),tip=$("tip");
const bc=document.createElement("canvas"),bx=bc.getContext("2d");
let S=[],TR=[],CV=[],EV=[],title="",live=false,follow=true;
let W=0,H=0,v={t0:0,t1:1,p0:0,p1:1},dirty=true,cross=null,hit=[],drag=null;
let L={AX:50,COB:46,SVP:92,CVD:120,TAX:22,VOL:46,FUT:.12};
const opt={candele:true,bolle:true,volume:true,tf:60000};
try{const o=JSON.parse(localStorage.getItem("mappa_opt")||"{}");Object.assign(opt,o)}catch(e){}
function saveOpt(){try{localStorage.setItem("mappa_opt",JSON.stringify(opt))}catch(e){}}
// ---- palette calore: fondo ardesia -> blu -> arancio -> rosso -> giallo -> bianco
const ST=[[0,[26,32,39]],[.14,[30,52,76]],[.34,[28,100,150]],[.52,[226,134,44]],[.72,[210,52,44]],[.88,[255,225,74]],[1,[255,251,232]]];
const PAL=[];for(let i=0;i<64;i++){const x=i/63;let a=ST[0],b=ST[ST.length-1];for(let k=0;k<ST.length-1;k++)if(x>=ST[k][0]&&x<=ST[k+1][0]){a=ST[k];b=ST[k+1];break}const f=(x-a[0])/((b[0]-a[0])||1);PAL.push("rgb("+[0,1,2].map(j=>Math.round(a[1][j]+(b[1][j]-a[1][j])*f)).join(",")+")")}
let QREF=1,QMAX=20,svp=new Map(),svpMax=1;
function prep(){
  CV=[];let c=0;svp=new Map();
  for(const t of TR){c+=t[3]*t[2];CV.push(c);const b=Math.floor(t[1]);let o=svp.get(b);if(!o){o={b:0,s:0};svp.set(b,o)}t[3]>0?o.b+=t[2]:o.s+=t[2]}
  const q=[];for(let i=0;i<S.length;i+=Math.max(1,S.length>400?5:1))for(const k of S[i].c)q.push(k[1]);q.sort((a,b)=>a-b);
  if(q.length){QREF=Math.max(.05,q[q.length>>1]);QMAX=Math.max(QREF*4,q[Math.floor(q.length*.995)])}
}
const mw=()=>W-L.AX-L.COB-L.SVP, ph=()=>H-L.CVD-L.TAX, pmain=()=>ph()-0; // altezza area prezzo
const tx=t=>(t-v.t0)/(v.t1-v.t0)*mw(), py=p=>pmain()-(p-v.p0)/(v.p1-v.p0)*pmain();
const xt=x=>v.t0+x/mw()*(v.t1-v.t0), yp=y=>v.p0+(pmain()-y)/pmain()*(v.p1-v.p0);
function lb(a,t,f){let i=0,j=a.length;while(i<j){const m=(i+j)>>1;if(f(a[m])<t)i=m+1;else j=m}return i}
function nice(span,n){const r=span/n,p=Math.pow(10,Math.floor(Math.log10(r))),m=r/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p}
const TST=[1,2,5,10,20,50,100,200,500,1e3,2e3,5e3,1e4,2e4,3e4,6e4,12e4,3e5,6e5,9e5,18e5,36e5];
const pd=(n,l=2)=>String(n).padStart(l,"0");
function fmtT(t,ms){const d=new Date(t);return pd(d.getUTCHours())+":"+pd(d.getUTCMinutes())+":"+pd(d.getUTCSeconds())+(ms?"."+pd(d.getUTCMilliseconds(),3):"")}
function fmtHM(t){const d=new Date(t);return pd(d.getUTCHours())+":"+pd(d.getUTCMinutes())}
function lay(){const n=innerWidth<700;L.AX=n?42:50;L.COB=n?0:46;L.SVP=n?44:92;L.CVD=n?90:120}
function fit(){
  if(!S.length)return;
  const last=S[S.length-1].t,span=live?150000:2400000;
  v.t1=last+(last-Math.max(S[0].t,last-span))*L.FUT/(1-L.FUT);v.t0=Math.max(S[0].t,last-span);
  let lo=1e12,hi=0,j=lb(TR,v.t0,t=>t[0]);for(;j<TR.length;j++){const p=TR[j][1];if(p<lo)lo=p;if(p>hi)hi=p}
  if(lo>hi){lo=S[S.length-1].mid-40;hi=S[S.length-1].mid+40}
  const pad=Math.max(8,(hi-lo)*.12);v.p0=lo-pad;v.p1=hi+pad;follow=true;dirty=true;
}
function size(){lay();const r=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0);bc.width=cv.width;bc.height=cv.height;bx.setTransform(r,0,0,r,0,0);dirty=true;draw()}
// ---- candele per timeframe
function candles(){
  const tf=opt.tf,out=[];let j=lb(TR,v.t0-tf,t=>t[0]);let cur=null;
  for(;j<TR.length;j++){const t=TR[j];if(t[0]>v.t1)break;const k=Math.floor(t[0]/tf);
    if(!cur||cur.k!==k){cur={k,t:k*tf,o:t[1],h:t[1],l:t[1],c:t[1],b:0,s:0};out.push(cur)}
    cur.h=Math.max(cur.h,t[1]);cur.l=Math.min(cur.l,t[1]);cur.c=t[1];t[3]>0?cur.b+=t[2]:cur.s+=t[2]}
  return out;
}
function renderBase(){
  const x=bx,w=mw(),h=pmain();
  x.fillStyle="#1a2027";x.fillRect(0,0,W,H);
  x.save();x.beginPath();x.rect(0,0,w,h);x.clip();
  // heatmap
  const lq=Math.log1p(QMAX/QREF);let i0=Math.max(0,lb(S,v.t0,s=>s.t)-1);
  for(let i=i0;i<S.length;i++){const s=S[i];if(s.t>v.t1)break;
    const xa=tx(s.t),xb=tx(i+1<S.length?S[i+1].t:s.t+500),ww=Math.max(1,xb-xa+.6);
    for(const k of s.c){if(k[0]+1<v.p0||k[0]>v.p1)continue;const idx=Math.min(63,Math.floor(Math.log1p(k[1]/QREF)/lq*63));if(idx<=0)continue;
      const y1=py(k[0]+1),y0=py(k[0]);x.fillStyle=PAL[idx];x.fillRect(xa,y1,ww,y0-y1+.6)}}
  // barre del libro "nel futuro" (libro dell'ultimo campione)
  if(S.length){const s=S[S.length-1],xf=tx(s.t)+2;if(xf<w){for(const k of s.c){if(k[0]+1<v.p0||k[0]>v.p1)continue;const idx=Math.min(63,Math.floor(Math.log1p(k[1]/QREF)/lq*63));if(idx<=1)continue;
      const y1=py(k[0]+1),y0=py(k[0]);x.fillStyle=PAL[idx];x.fillRect(xf,y1+.5,w-xf,Math.max(1.5,y0-y1-1))}}}
  // griglia verticale ogni passo di tempo
  const tr=(v.t1-v.t0)/(W<640?4:8);const step=TST.find(a=>a>=tr)||TST[TST.length-1];
  x.setLineDash([3,4]);x.strokeStyle="#ffffff22";for(let t=Math.ceil(v.t0/step)*step;t<v.t1;t+=step){const X=tx(t);x.beginPath();x.moveTo(X,0);x.lineTo(X,h);x.stroke()}x.setLineDash([]);
  // candele
  const cs=candles();
  if(opt.candele){const cw=Math.max(2,Math.min(26,(tx(v.t0+opt.tf)-tx(v.t0))*.62));
    for(const c of cs){const X=tx(c.t+opt.tf/2),up=c.c>=c.o,col=up?"#46d17b":"#e5605a";
      x.strokeStyle="#f2f5f8";x.lineWidth=1;x.beginPath();x.moveTo(X,py(c.h));x.lineTo(X,py(c.l));x.stroke();
      const yt=py(Math.max(c.o,c.c)),yb=py(Math.min(c.o,c.c));x.fillStyle=up?"rgba(70,209,123,.38)":"rgba(229,96,90,.42)";x.fillRect(X-cw/2,yt,cw,Math.max(1,yb-yt));x.strokeStyle="#f2f5f8";x.strokeRect(X-cw/2+.5,yt+.5,cw-1,Math.max(1,yb-yt)-1)}}
  // mid
  x.strokeStyle="#ffffff88";x.lineWidth=1;x.beginPath();let st=false;for(let i=i0;i<S.length;i++){const s=S[i];if(s.t>v.t1+2000)break;const X=tx(s.t),Y=py(s.mid);if(!st){x.moveTo(X,Y);st=true}else x.lineTo(X,Y)}x.stroke();
  // eventi
  for(const e of EV){const X=tx(e[0]);if(X<0||X>w)continue;x.strokeStyle="#ffd166";x.setLineDash([4,4]);x.beginPath();x.moveTo(X,0);x.lineTo(X,h);x.stroke();x.setLineDash([]);x.fillStyle="#ffd166";x.font="11px system-ui";x.fillText(e[1],Math.min(X+5,w-200),14)}
  // bolle raggruppate
  hit=[];
  if(opt.bolle){const GX=20,GY=16,cl=new Map();let j0=lb(TR,v.t0,t=>t[0]);
    for(let j=j0;j<TR.length;j++){const t=TR[j];if(t[0]>v.t1)break;if(t[1]<v.p0||t[1]>v.p1)continue;const X=tx(t[0]),Y=py(t[1]),key=Math.floor(X/GX)+"|"+Math.floor(Y/GY)+"|"+t[3];
      let c=cl.get(key);if(!c){c={q:0,qp:0,qt:0,n:0,s:t[3]};cl.set(key,c)}c.q+=t[2];c.qp+=t[2]*t[1];c.qt+=t[2]*t[0];c.n++}
    for(const c of cl.values()){if(c.q<=0)continue;const X=tx(c.qt/c.q),Y=py(c.qp/c.q),r=Math.min(38,2+3.4*Math.log1p(c.q/.03));
      x.fillStyle=c.s>0?"rgba(86,224,132,.42)":"rgba(240,98,92,.42)";x.strokeStyle=c.s>0?"#56e084":"#f0625c";x.lineWidth=c.n>1?1.5:1;x.beginPath();x.arc(X,Y,r,0,6.2832);x.fill();x.stroke();
      if(r>13){x.fillStyle="#fff";x.font="11px system-ui";x.textAlign="center";x.fillText(c.q>=10?c.q.toFixed(0):c.q.toFixed(1),X,Y+4);x.textAlign="left"}hit.push({x:X,y:Y,r,c})}}
  // istogramma volume sul fondo dell'area prezzo
  if(opt.volume&&cs.length){const mxv=Math.max(...cs.map(c=>c.b+c.s),1e-9),H0=L.VOL,cw=Math.max(2,(tx(v.t0+opt.tf)-tx(v.t0))*.8);
    for(const c of cs){const X=tx(c.t+opt.tf/2),hb=c.b/mxv*H0,hs=c.s/mxv*H0;x.fillStyle="rgba(229,96,90,.75)";x.fillRect(X-cw/2,h-hs,cw,hs);x.fillStyle="rgba(70,209,123,.75)";x.fillRect(X-cw/2,h-hs-hb,cw,hb)}}
  x.restore();
  // asse prezzi + griglia
  x.fillStyle="#222a33";x.fillRect(w,0,L.AX,h);x.fillStyle="#9fb0c2";x.font="11px system-ui";
  const ps=nice(v.p1-v.p0,10);for(let p=Math.ceil(v.p0/ps)*ps;p<v.p1;p+=ps){const Y=py(p);x.fillText(p.toFixed(ps<1?1:0),w+4,Y+4);x.strokeStyle="#ffffff0d";x.beginPath();x.moveTo(0,Y);x.lineTo(w,Y);x.stroke()}
  // SVP: profilo del volume di sessione (tutti i trade), acquisti e vendite
  x.save();x.beginPath();x.rect(w+L.AX+L.COB,0,L.SVP,h);x.clip();x.fillStyle="#1f262e";x.fillRect(w+L.AX+L.COB,0,L.SVP,h);
  let mx=0,poc=-1,pm=0;for(const [b,o] of svp){if(b<v.p0-1||b>v.p1)continue;const t=o.b+o.s;if(t>mx)mx=t;if(t>pm){pm=t;poc=b}}
  const sx=w+L.AX+L.COB;
  if(L.SVP>0&&mx>0){for(const [b,o] of svp){if(b<v.p0-1||b>v.p1)continue;const y1=py(b+1),y0=py(b),hh=Math.max(1,y0-y1-.4),wb=o.b/mx*(L.SVP-6),ws=o.s/mx*(L.SVP-6);x.fillStyle="rgba(70,209,123,.85)";x.fillRect(sx+2,y1,wb,hh);x.fillStyle="rgba(229,96,90,.85)";x.fillRect(sx+2+wb,y1,ws,hh)}
    if(poc>=0){x.strokeStyle="#ffd166";x.beginPath();x.moveTo(sx,py(poc+.5));x.lineTo(sx+L.SVP,py(poc+.5));x.stroke()}}
  x.restore();x.fillStyle="#9fb0c2";x.font="10px system-ui";if(L.SVP>=80)x.fillText("PROFILO",sx+4,10);
  // CVD
  const cy0=h,ch=L.CVD;x.fillStyle="#1d242b";x.fillRect(0,cy0,w,ch);
  const k0=Math.max(0,lb(TR,v.t0,t=>t[0])-1);let lo=1e18,hi=-1e18,k1=k0;for(let j=k0;j<TR.length&&TR[j][0]<=v.t1;j++){lo=Math.min(lo,CV[j]);hi=Math.max(hi,CV[j]);k1=j}
  if(hi>=lo){lo=Math.min(lo,0);hi=Math.max(hi,0);if(hi-lo<1e-6)hi=lo+1;const yv=a=>cy0+ch-8-(a-lo)/(hi-lo)*(ch-16);
    x.strokeStyle="#ffffff14";x.lineWidth=1;for(let g=0;g<=4;g++){const Y=cy0+8+g*(ch-16)/4;x.beginPath();x.moveTo(0,Y);x.lineTo(w,Y);x.stroke()}
    x.strokeStyle="#000";x.beginPath();x.moveTo(0,yv(0));x.lineTo(w,yv(0));x.stroke();
    x.save();x.beginPath();x.rect(0,cy0,w,ch);x.clip();x.lineWidth=1.4;let prevUp=null;x.beginPath();
    for(let j=k0;j<=k1;j++){const X=tx(TR[j][0]),Y=yv(CV[j]),up=CV[j]>=0;if(prevUp===null){x.moveTo(X,Y)}else if(up!==prevUp){x.strokeStyle=prevUp?"#46d17b":"#e5605a";x.stroke();x.beginPath();x.moveTo(X,Y)}else x.lineTo(X,Y);prevUp=up}
    if(prevUp!==null){x.strokeStyle=prevUp?"#46d17b":"#e5605a";x.stroke()}x.restore();
    x.fillStyle="#46d17b";x.font="10px system-ui";x.fillText(hi.toFixed(1),4,cy0+16);x.fillStyle="#e5605a";x.fillText(lo.toFixed(1),4,cy0+ch-6)}
  x.fillStyle="#9fb0c2";x.font="11px system-ui";x.fillText("CVD",w-30,cy0+14);
  // indicatore CVD (arco) nella zona destra
  const gx=w+L.AX+L.COB+L.SVP/2+(L.COB?-L.COB/2:0),gy=cy0+ch/2+8,gr=Math.min(34,ch/2-8),cur=k1>=k0&&CV.length?CV[k1]:0,ab=Math.max(10,Math.abs(hi),Math.abs(lo));
  x.fillStyle="#222a33";x.fillRect(w,cy0,W-w,ch);
  x.lineWidth=7;x.strokeStyle="#3b4854";x.beginPath();x.arc(gx,gy,gr,Math.PI*.75,Math.PI*2.25);x.stroke();
  x.strokeStyle=cur>=0?"#46d17b":"#e5605a";x.beginPath();const fr=Math.min(1,Math.abs(cur)/ab)*Math.PI*1.5/2;x.arc(gx,gy,gr,Math.PI*1.5-fr*(cur<0?1:0),Math.PI*1.5+fr*(cur>=0?1:0));x.stroke();
  x.fillStyle="#d9e0e8";x.textAlign="center";x.font="10px system-ui";x.fillText("CVD",gx,gy-3);x.font="bold 12px system-ui";x.fillText(cur.toFixed(1),gx,gy+12);x.textAlign="left";
  // asse tempo
  x.fillStyle="#222a33";x.fillRect(0,cy0+ch,W,L.TAX);x.fillStyle="#9fb0c2";x.font="11px system-ui";
  for(let t=Math.ceil(v.t0/step)*step;t<v.t1;t+=step){const X=tx(t);x.fillText(step<1000?fmtT(t,true):step<6e4?fmtT(t,false):fmtHM(t),X-(step<1000?30:step<6e4?20:14),cy0+ch+15)}
  dirty=false;
}
function draw(){
  if(!W)return;if(dirty)renderBase();
  cx.setTransform(1,0,0,1,0,0);cx.drawImage(bc,0,0);const r=window.devicePixelRatio||1;cx.setTransform(r,0,0,r,0,0);
  const w=mw(),h=pmain();
  // colonna del libro (COB): quantita' per livello, al momento del cursore (o ultimo)
  if(L.COB>0&&S.length){let smp=S[S.length-1];if(cross){const i=Math.max(0,Math.min(S.length-1,lb(S,xt(cross.x),s=>s.t)-1));if(S[i]&&xt(cross.x)<=S[S.length-1].t)smp=S[i]}
    const px=(h)/(v.p1-v.p0);const cx0=w+L.AX;cx.fillStyle="#1f262e";cx.fillRect(cx0,0,L.COB,h);cx.font="10px system-ui";
    const bins=new Map();for(const k of smp.c){bins.set(k[0],(bins.get(k[0])||0)+k[1]);}let lastY=-99;
    for(const [p,q] of [...bins].sort((a,b)=>b[1]-a[1])){if(p+1<v.p0||p>v.p1)continue;const Y=py(p+.5),isAsk=smp.c.some(k=>k[0]===p&&k[2]===1);
      const idx=Math.min(63,Math.floor(Math.log1p(q/QREF)/Math.log1p(QMAX/QREF)*63));cx.fillStyle=PAL[Math.max(0,idx)];cx.globalAlpha=.55;cx.fillRect(cx0,py(p+1),Math.min(L.COB,q/QMAX*L.COB),Math.max(1,px-.5));cx.globalAlpha=1;
      if((px>=10||q>=QMAX*.35)&&Math.abs(Y-lastY)>=10){lastY=Y;cx.fillStyle=isAsk?"#f0a3a0":"#9fe3b4";cx.fillText(q>=10?q.toFixed(1):q.toFixed(2),cx0+3,Y+3.5)}}
    cx.fillStyle="#9fb0c2";cx.fillText("LIBRO",cx0+3,10)}
  if(cross){cx.strokeStyle="#ffffff55";cx.setLineDash([3,3]);cx.beginPath();cx.moveTo(cross.x,0);cx.lineTo(cross.x,h);cx.moveTo(0,cross.y);cx.lineTo(w,cross.y);cx.stroke();cx.setLineDash([]);
    cx.fillStyle="#2f6f9f";cx.fillRect(w,cross.y-8,L.AX,16);cx.fillStyle="#fff";cx.font="11px system-ui";cx.fillText(yp(cross.y).toFixed(1),w+4,cross.y+4)}
}
// ---- zoom / pan (mouse + touch)
function zoomT(f,x){const t=xt(x);v.t0=t-(t-v.t0)*f;v.t1=t+(v.t1-t)*f;if(v.t1-v.t0<30){const m=(v.t0+v.t1)/2;v.t0=m-15;v.t1=m+15}dirty=true}
function zoomP(f,y){const p=yp(y);v.p0=p-(p-v.p0)*f;v.p1=p+(v.p1-p)*f;if(v.p1-v.p0<1.5){const m=(v.p0+v.p1)/2;v.p0=m-.75;v.p1=m+.75}dirty=true}
cv.addEventListener("wheel",e=>{e.preventDefault();const r=cv.getBoundingClientRect(),f=e.deltaY>0?1.18:1/1.18,x=e.clientX-r.left,y=e.clientY-r.top;(e.shiftKey||x>mw())?zoomP(f,y):zoomT(f,x);follow=false;draw()},{passive:false});
const ptr=new Map();let pinch=null,moved=0,lastTap=0;
function showTip(x,y,cxp,cyp){
  if(x>mw()||y>pmain()){cross=null;tip.style.display="none";draw();return}
  cross={x,y};draw();const t=xt(x),p=yp(y);let txt=fmtT(t,true)+" UTC\nprezzo "+p.toFixed(1);
  const si=Math.max(0,lb(S,t,s=>s.t)-1);if(S[si]){const bn=Math.floor(p),c=S[si].c.find(k=>k[0]===bn);txt+="\nlibro in questo $: "+(c?c[1].toFixed(2)+" BTC ("+(c[2]?"vendita":"acquisto")+")":"—")}
  for(const o of hit){if(Math.hypot(o.x-x,o.y-y)<=Math.max(o.r,12)){txt+="\n— bolla: "+o.c.q.toFixed(3)+" BTC, "+(o.c.s>0?"acquisto":"vendita")+" aggressiva, "+o.c.n+" trade";break}}
  tip.textContent=txt;tip.style.display="block";tip.style.left=Math.max(4,Math.min(cxp+14,innerWidth-250))+"px";tip.style.top=Math.max(48,Math.min(cyp+14,innerHeight-110))+"px"}
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(ptr.size===1)drag={x:e.clientX,y:e.clientY,v:{...v}};
  if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={dx:Math.abs(a.x-b.x)||1,dy:Math.abs(a.y-b.y)||1,v:{...v},mx:(a.x+b.x)/2,my:(a.y+b.y)/2};drag=null}});
cv.addEventListener("pointermove",e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(ptr.has(e.pointerId))ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptr.size>=2){const [a,b]=[...ptr.values()];const dx=Math.abs(a.x-b.x)||1,dy=Math.abs(a.y-b.y)||1;moved=9;const sx=pinch.dx/dx,vv=pinch.v,mxp=pinch.mx-r.left,myp=pinch.my-r.top;
    const t=vv.t0+mxp/mw()*(vv.t1-vv.t0);v.t0=t-(t-vv.t0)*sx;v.t1=t+(vv.t1-t)*sx;
    if(Math.abs(a.y-b.y)>40||dy>dx){const sy=pinch.dy/dy,p=vv.p0+(pmain()-myp)/pmain()*(vv.p1-vv.p0);v.p0=p-(p-vv.p0)*sy;v.p1=p+(vv.p1-p)*sy}dirty=true;follow=false;draw();return}
  if(drag&&ptr.size===1&&(e.buttons||e.pointerType==="touch")){const mdx=e.clientX-drag.x,mdy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(mdx,mdy));
    const dx=mdx/mw()*(drag.v.t1-drag.v.t0),dy=mdy/pmain()*(drag.v.p1-drag.v.p0);v.t0=drag.v.t0-dx;v.t1=drag.v.t1-dx;v.p0=drag.v.p0+dy;v.p1=drag.v.p1+dy;follow=false;dirty=true;draw();return}
  if(e.pointerType==="mouse")showTip(x,y,e.clientX,e.clientY)});
function up(e){const r=cv.getBoundingClientRect(),was=ptr.size;ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;
  if(ptr.size===0){drag=null;if(e.pointerType==="touch"&&moved<8&&was===1){const now=Date.now();if(now-lastTap<320){fit();draw();tip.style.display="none"}else showTip(e.clientX-r.left,e.clientY-r.top,e.clientX,e.clientY);lastTap=now}}
  else if(ptr.size===1){const [a]=[...ptr.values()];drag={x:a.x,y:a.y,v:{...v}}}}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("dblclick",()=>{fit();draw()});
cv.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"){cross=null;tip.style.display="none";draw()}});
// ---- pulsanti
function sync(){$("bCa").classList.toggle("on",opt.candele);$("bBo").classList.toggle("on",opt.bolle);$("bVo").classList.toggle("on",opt.volume);$("sTf").value=String(opt.tf)}
$("bCa").onclick=()=>{opt.candele=!opt.candele;saveOpt();sync();dirty=true;draw()};
$("bBo").onclick=()=>{opt.bolle=!opt.bolle;saveOpt();sync();dirty=true;draw()};
$("bVo").onclick=()=>{opt.volume=!opt.volume;saveOpt();sync();dirty=true;draw()};
$("sTf").onchange=e=>{opt.tf=+e.target.value;saveOpt();dirty=true;draw()};
$("bR").onclick=()=>{fit();draw()};
window.addEventListener("resize",size);
function load(d){S=d.samples.map(s=>{const c=[];if(s[2].length&&typeof s[2][0]==="number"){for(let i=0;i<s[2].length;i+=3)c.push([s[2][i],s[2][i+1],s[2][i+2]])}else for(const k of s[2])c.push(k);return{t:s[0],mid:s[1],c}});TR=d.trades;EV=d.eventi||[];title=d.titolo;$("tit").textContent=title;prep();fit()}
// ---- live Kraken (feed pubblico v2)
let ws=null,bids=new Map(),asks=new Map(),timer=null;
function liveStart(){
  S=[];TR=[];CV=[];EV=[];svp=new Map();bids.clear();asks.clear();live=true;title="LIVE Kraken BTC/USD (libro 100 livelli)";$("tit").textContent=title;
  ws=new WebSocket("wss://ws.kraken.com/v2");
  ws.onopen=()=>{ws.send(JSON.stringify({method:"subscribe",params:{channel:"book",symbol:["BTC/USD"],depth:100}}));ws.send(JSON.stringify({method:"subscribe",params:{channel:"trade",symbol:["BTC/USD"]}}))};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.channel==="book"&&m.data){for(const d of m.data){if(m.type==="snapshot"){bids.clear();asks.clear()}for(const p of d.bids){p.qty===0?bids.delete(p.price):bids.set(p.price,p.qty)}for(const p of d.asks){p.qty===0?asks.delete(p.price):asks.set(p.price,p.qty)}}
      const ba=Math.min(...asks.keys()),bb=Math.max(...bids.keys());for(const k of [...asks.keys()])if(k<=bb)asks.delete(k);for(const k of [...bids.keys()])if(k>=ba)bids.delete(k)}
    else if(m.channel==="trade"&&m.data){for(const x of m.data){const t=[Date.parse(x.timestamp),x.price,x.qty,x.side==="buy"?1:-1];TR.push(t);CV.push((CV.length?CV[CV.length-1]:0)+t[3]*t[2]);const b=Math.floor(t[1]);let o=svp.get(b);if(!o){o={b:0,s:0};svp.set(b,o)}t[3]>0?o.b+=t[2]:o.s+=t[2]}}};
  ws.onclose=()=>{clearInterval(timer)};
  timer=setInterval(()=>{if(!bids.size||!asks.size)return;const bb=Math.max(...bids.keys()),ba=Math.min(...asks.keys()),cells=new Map();
    for(const [p,q] of bids)if(p>=bb-80){const k=Math.floor(p)+"b",o=cells.get(k)||[Math.floor(p),0,0];o[1]+=q;cells.set(k,o)}
    for(const [p,q] of asks)if(p<=ba+80){const k=Math.floor(p)+"a",o=cells.get(k)||[Math.floor(p),0,1];o[1]+=q;cells.set(k,o)}
    const now=Date.now();S.push({t:now,mid:(bb+ba)/2,c:[...cells.values()].map(o=>[o[0],+o[1].toFixed(2),o[2]])});
    if(S.length>7200)S.shift();while(TR.length>1&&TR[0][0]<S[0].t-5000){TR.shift();CV.shift()}
    if(S.length===1||S.length%30===0){const q=[];for(const s of S.slice(-200))for(const k of s.c)q.push(k[1]);q.sort((a,b)=>a-b);if(q.length){QREF=Math.max(.05,q[q.length>>1]);QMAX=Math.max(QREF*4,q[Math.floor(q.length*.995)])}}
    if(S.length<3)fit();else if(follow){const span=v.t1-v.t0,fut=span*L.FUT;v.t1=now+fut;v.t0=v.t1-span;const c=(bb+ba)/2;if(c<v.p0+8||c>v.p1-8){const m=v.p1-v.p0;v.p0=c-m/2;v.p1=c+m/2}}
    dirty=true;draw()},500)}
$("bL").onclick=function(){if(!live){this.classList.add("on");this.textContent="Replay";liveStart()}else{if(ws)ws.close();clearInterval(timer);live=false;this.classList.remove("on");this.textContent="Live";load(window.DATI3);draw()}};
// ---- Copia per Claude
function snapshot(){
  const f1=x=>x.toFixed(1),f2=x=>x.toFixed(2),j0=lb(TR,v.t0,t=>t[0]);let j1=j0;while(j1<TR.length&&TR[j1][0]<=v.t1)j1++;
  const tr=TR.slice(j0,j1);let bv=0,sv=0,hi=-1e18,lo=1e18;for(const t of tr){t[3]>0?bv+=t[2]:sv+=t[2];hi=Math.max(hi,t[1]);lo=Math.min(lo,t[1])}
  const Ls=["DATI DALLA MAPPA NEXUS (BTC/USD Kraken spot, libro 100 livelli) — "+(live?"LIVE":"REPLAY")+" — "+title,
   "Finestra visibile: "+fmtT(v.t0,true)+" → "+fmtT(v.t1,true)+" UTC ("+((v.t1-v.t0)/1000).toFixed(1)+" s); prezzo visibile "+f1(v.p0)+" – "+f1(v.p1)];
  const iA=Math.max(0,Math.min(S.length-1,lb(S,v.t0,s=>s.t))),iB=Math.min(S.length-1,Math.max(0,lb(S,v.t1,s=>s.t)-1));
  Ls.push(tr.length?"Trade nella finestra: "+tr.length+" | acquisti aggressivi "+f2(bv)+" BTC, vendite aggressive "+f2(sv)+" BTC, delta "+f2(bv-sv)+" BTC | prezzo trade: primo "+f1(tr[0][1])+", ultimo "+f1(tr[tr.length-1][1])+", max "+f1(hi)+", min "+f1(lo):"Nessun trade nella finestra visibile.");
  const walls=s=>{if(!s)return"n/d";const mid=s.mid,cs=s.c.filter(k=>Math.abs(k[0]-mid)<=60).sort((a,b)=>b[1]-a[1]).slice(0,5);let bq=0,aq=0;for(const k of s.c)if(Math.abs(k[0]-mid)<=30)k[2]?aq+=k[1]:bq+=k[1];
    return"mid "+f1(mid)+"; liquidità entro 30$: bid "+f1(bq)+" BTC, ask "+f1(aq)+" BTC (sbilanciamento bid/(bid+ask) "+(bq+aq>0?(100*bq/(bq+aq)).toFixed(0):"-")+"%); livelli più grossi entro 60$: "+(cs.length?cs.map(k=>(k[2]?"ask ":"bid ")+k[0]+" ("+f1(k[1])+" BTC)").join(", "):"nessuno")};
  if(S.length){Ls.push("Libro all'inizio finestra: "+walls(S[iA]));Ls.push("Libro alla fine finestra:  "+walls(S[iB]));
    const fin=new Set(S[iB].c.map(k=>k[0]+"|"+k[2])),gone=S[iA].c.filter(k=>k[1]>=5&&Math.abs(k[0]-S[iA].mid)<=60&&!fin.has(k[0]+"|"+k[2]));
    if(gone.length)Ls.push("Livelli ≥5 BTC presenti all'inizio e non più presenti alla fine (consumati o ritirati, non distinguibili da qui): "+gone.slice(0,6).map(k=>(k[2]?"ask ":"bid ")+k[0]+" ("+f1(k[1])+" BTC)").join(", "))}
  const bub=hit.map(o=>o.c).sort((a,b)=>b.q-a.q).slice(0,8);if(bub.length)Ls.push("Bolle più grosse visibili (raggruppate allo zoom corrente): "+bub.map(c=>fmtT(c.qt/c.q,true)+" "+f1(c.qp/c.q)+" "+(c.s>0?"acquisto":"vendita")+" "+f2(c.q)+" BTC ("+c.n+" trade)").join(" ; "));
  const bins=new Map();for(const t of tr){const b=Math.floor(t[1]);bins.set(b,(bins.get(b)||0)+t[2])}let poc=null,pm=0;for(const [b,q] of bins)if(q>pm){pm=q;poc=b}
  if(poc!==null)Ls.push("POC della finestra (livello con più volume scambiato): "+poc+" ("+f2(pm)+" BTC)");
  if(j1>j0)Ls.push("CVD: da "+f2(CV[j0])+" a "+f2(CV[j1-1])+" BTC (variazione "+f2(CV[j1-1]-CV[j0])+")");
  const cs=candles();if(cs.length){const c0=cs[0],c1=cs[cs.length-1];Ls.push("Candele "+(opt.tf/1000)+" s nella finestra: "+cs.length+"; prima open "+f1(c0.o)+", ultima close "+f1(c1.c)+"; massimo "+f1(Math.max(...cs.map(c=>c.h)))+", minimo "+f1(Math.min(...cs.map(c=>c.l))))}
  const ev=EV.filter(e=>e[0]>=v.t0&&e[0]<=v.t1);if(ev.length)Ls.push("Eventi segnalati nella finestra: "+ev.map(e=>fmtT(e[0],true)+" "+e[1]).join(" ; "));
  Ls.push("Nota: dati del solo libro/trade Kraken spot; nessun attore identificabile; condizioni di vantaggio temporaneo ≠ edge statistico (le definizioni congelate sono nei protocolli v34–v35).");
  return Ls.join("\n")}
function cpBuild(){const n=$("cpN").value.trim();$("cpT").value=(n?"LA MIA LETTURA: "+n+"\n\n":"")+snapshot()+"\n\nRichiesta: verifica se la mia lettura è corretta; confrontala con le registrazioni (casi simili, esiti a 1/5/15 min al netto dei costi, campione e baseline) e dimmi quali condizioni vedi tu."}
$("bC").onclick=()=>{cpBuild();$("cp").hidden=false;$("cpM").textContent=""};$("cpX").onclick=()=>{$("cp").hidden=true};$("cpN").addEventListener("input",cpBuild);
$("cpC").onclick=async()=>{cpBuild();const t=$("cpT");try{await navigator.clipboard.writeText(t.value);$("cpM").textContent="Copiato"}catch(e){t.removeAttribute("readonly");t.select();try{document.execCommand("copy");$("cpM").textContent="Copiato"}catch(_){$("cpM").textContent="Selezionato: copia a mano"}t.setAttribute("readonly","")}};
sync();load(window.DATI3);size();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
