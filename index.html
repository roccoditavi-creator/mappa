<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">

<title>Mappa liquidità NEXUS</title>
<style>
:root{--bg:#1a2027;--panel:#232b34;--ln:#33404d;--fg:#d9e0e8;--mut:#8b9aab;--buy:#46d17b;--sell:#e5605a;--acc:#7cc4ff}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}

#top h1{font-size:14px;margin:0 6px 0 0;font-weight:600}

#c{touch-action:none;display:block;width:100%;height:calc(100% - 42px);cursor:crosshair}
#hp{position:fixed;top:46px;right:10px;z-index:8;background:var(--panel);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:270px;box-shadow:0 6px 24px #000a}#hp[hidden]{display:none}#hp label{display:block;color:var(--mut);font-size:12px;margin:8px 0 2px}#hp input{width:100%}#hp canvas{display:block;width:100%;height:14px;margin:6px 0;border-radius:3px}

.box{background:var(--panel);border:1px solid var(--ln);border-radius:12px 12px 0 0;padding:12px;width:min(720px,100%);max-height:92%;overflow:auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.box label{display:block;color:var(--mut);font-size:12px;margin:8px 0 4px}
.box textarea{width:100%;background:#12171c;color:var(--fg);border:1px solid var(--ln);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace}

@media(max-width:640px){#top h1{display:none}}
</style></head><body>
<div id="top"><h1>Mappa liquidità <small style="font-weight:400;color:var(--mut)">v13</small></h1><span class="t" id="tit"></span>
<button id="bCa" class="on">Candele</button><select id="sTf"><option value="15000">15 s</option><option value="60000" selected>1 min</option><option value="300000">5 min</option></select>
<button id="bNe" class="on">Sfondo nero</button><button id="bCo" title="Intensità e contrasto della mappa di calore">Colori ▾</button><button id="bBo" class="on">Bolle</button><button id="bVo" class="on">Volume</button>
<button id="bYm" title="Scala prezzo: Auto = si adatta ai dati visibili; Fisso = altezza fissa centrata sul prezzo; Libero = la sposti tu">Prezzo: Fisso</button><button id="bY1" title="Riduci altezza (più zoom sul prezzo)">Altezza −</button><button id="bY2" title="Aumenta altezza (meno zoom sul prezzo)">Altezza +</button>
<button id="bG1" title="Granularità più fine: righe più sottili ([)">Passo −</button><button id="bGl" title="Passo del prezzo; clic = automatico">Passo: auto</button><button id="bG2" title="Granularità più larga: righe più spesse (])">Passo +</button>
<button id="bR">Vista intera</button><button id="bU" title="Ricentra il grafico su prezzo e ultime transazioni (tasto C)">Ricentra</button><button id="bL">Live</button><button id="bC">Copia per Claude</button></div>
<div id="hp" hidden><b>Mappa di calore</b><canvas id="hg" width="240" height="14"></canvas>
<label>Luminosità <span id="vl"></span></label><input type="range" id="rl" min="40" max="220" step="5">
<label>Contrasto <span id="vc"></span></label><input type="range" id="rc" min="50" max="300" step="5">
<label>Sensibilità (verso destra: anche i livelli piccoli si accendono) <span id="vs"></span></label><input type="range" id="rs" min="25" max="400" step="5">
<div class="rw"><button id="hr">Ripristina</button><button id="hx">Chiudi</button></div></div>
<canvas id="c"></canvas><div id="tip"></div>
<div id="cp" hidden><div class="box"><div class="hd"><b>Copia per Claude</b><button id="cpX">Chiudi</button></div>
<label>La tua lettura (cosa vedi e cosa pensi)</label><textarea id="cpN" rows="4" placeholder="es. muro grosso sull'ask, poco volume sotto, secondo me spinge giù; vorrei capire se regge"></textarea>
<label>Testo pronto da incollare nella chat (dati della finestra visibile)</label><textarea id="cpT" rows="9" readonly></textarea>
<div class="rw"><button id="cpC" class="on">Copia tutto</button><span id="cpM"></span></div>
<small>Poi incolla nella chat con Claude e aggiungi lo screenshot della mappa.</small></div></div>
<script src="dati_replay.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id),cv=$("c"),cx=cv.getContext("2d"),tip=$("tip");
const bc=document.createElement("canvas"),bx=bc.getContext("2d");
let S=[],TR=[],CV=[],EV=[],title="",live=false,follow=true;
let W=0,H=0,v={t0:0,t1:1,p0:0,p1:1},dirty=true,cross=null,hit=[],drag=null;
let L={AX:50,COB:46,SVP:92,CVD:120,TAX:22,VOL:46,FUT:.1};
let ym="fisso",fixH=60,gran=0;const GR=[1,2,5,10,20,25,50,100];
function stepNow(){if(gran)return gran;const px=pmain()/(v.p1-v.p0);return GR.find(a=>a*px>=16)||100}
const agg=(cells,stp)=>{if(stp<=1)return cells;const m=new Map();for(const k of cells){const b=Math.floor(k[0]/stp)*stp;let o=m.get(b);if(!o){o=[b,0,k[2],0,0];m.set(b,o)}o[1]+=k[1];k[2]===1?o[4]+=k[1]:o[3]+=k[1]}for(const o of m.values())o[2]=o[4]>o[3]?1:(o[3]>0?0:o[2]);return [...m.values()]};
const opt={candele:true,bolle:true,volume:true,tf:60000,nero:true,pres3:.9,lum:1,con:1,sens:1};
try{const o=JSON.parse(localStorage.getItem("mappa_opt")||"{}");Object.assign(opt,o)}catch(e){}
function saveOpt(){try{localStorage.setItem("mappa_opt",JSON.stringify(opt))}catch(e){}}
// ---- palette calore: fondo ardesia -> blu -> arancio -> rosso -> giallo -> bianco
let ST=[[0,[26,32,39]],[.14,[30,52,76]],[.34,[28,100,150]],[.52,[226,134,44]],[.72,[210,52,44]],[.88,[255,225,74]],[1,[255,251,232]]];
const PAL=[];function buildPal(){PAL.length=0;ST[0][1]=opt.nero?[0,0,0]:[26,32,39];ST[1][1]=opt.nero?[14,34,72]:[30,52,76];for(let i=0;i<64;i++){const x=i/63;let a=ST[0],b=ST[ST.length-1];for(let k=0;k<ST.length-1;k++)if(x>=ST[k][0]&&x<=ST[k+1][0]){a=ST[k];b=ST[k+1];break}const f=(x-a[0])/((b[0]-a[0])||1);PAL.push("rgb("+[0,1,2].map(j=>Math.min(255,Math.round((a[1][j]+(b[1][j]-a[1][j])*f)*(opt.lum||1)))).join(",")+")")}}
const hv=v=>{v*=(opt.sens||1);v=(v-.4)*(opt.con||1)+.4;return v<=0?0:Math.min(63,Math.floor(v*63))};
buildPal();const BG=()=>opt.nero?"#000":"#1a2027";
let QREF=1,QMAX=20,svp=new Map(),svpMax=1;
function prep(){
  CV=[];let c=0;svp=new Map();
  for(const t of TR){c+=t[3]*t[2];CV.push(c);const b=Math.floor(t[1]);let o=svp.get(b);if(!o){o={b:0,s:0};svp.set(b,o)}t[3]>0?o.b+=t[2]:o.s+=t[2]}
  const q=[];for(let i=0;i<S.length;i+=Math.max(1,S.length>400?5:1))for(const k of S[i].c)q.push(k[1]);q.sort((a,b)=>a-b);
  if(q.length){QREF=Math.max(.05,q[q.length>>1]);QMAX=Math.max(QREF*4,q[Math.floor(q.length*.995)])}
}
const mw=()=>W-L.AX-L.COB-L.SVP, ph=()=>H-L.CVD-L.TAX, pmain=()=>ph()-0; // altezza area prezzo
const tx=t=>(t-v.t0)/(v.t1-v.t0)*mw(), py=p=>pmain()-(p-v.p0)/(v.p1-v.p0)*pmain();
const xt=x=>v.t0+x/mw()*(v.t1-v.t0), yp=y=>v.p0+(pmain()-y)/pmain()*(v.p1-v.p0);
function lb(a,t,f){let i=0,j=a.length;while(i<j){const m=(i+j)>>1;if(f(a[m])<t)i=m+1;else j=m}return i}
function nice(span,n){const r=span/n,p=Math.pow(10,Math.floor(Math.log10(r))),m=r/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p}
const TST=[1,2,5,10,20,50,100,200,500,1e3,2e3,5e3,1e4,2e4,3e4,6e4,12e4,3e5,6e5,9e5,18e5,36e5];
const pd=(n,l=2)=>String(n).padStart(l,"0");
function fmtT(t,ms){const d=new Date(t);return pd(d.getUTCHours())+":"+pd(d.getUTCMinutes())+":"+pd(d.getUTCSeconds())+(ms?"."+pd(d.getUTCMilliseconds(),3):"")}
function fmtHM(t){const d=new Date(t);return pd(d.getUTCHours())+":"+pd(d.getUTCMinutes())}
function lay(){const n=innerWidth<700;L.FUT=1-Math.min(.95,Math.max(.6,opt.pres3||.9));L.AX=n?48:64;L.COB=n?0:100;L.SVP=n?60:130;L.CVD=n?90:120}
function fit(){
  if(!S.length)return;
  const last=S[S.length-1].t,span=live?150000:2400000;
  v.t1=last+(last-Math.max(S[0].t,last-span))*L.FUT/(1-L.FUT);v.t0=Math.max(S[0].t,last-span);
  let lo=1e12,hi=0,j=lb(TR,v.t0,t=>t[0]);for(;j<TR.length;j++){const p=TR[j][1];if(p<lo)lo=p;if(p>hi)hi=p}
  if(lo>hi){lo=S[S.length-1].mid-40;hi=S[S.length-1].mid+40}
  const pad=Math.max(8,(hi-lo)*.12);v.p0=lo-pad;v.p1=hi+pad;follow=true;dirty=true;if(ym==="fisso")fixH=v.p1-v.p0;if(ym!=="libero")applyY(true);
}
function size(){lay();const r=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0);bc.width=cv.width;bc.height=cv.height;bx.setTransform(r,0,0,r,0,0);dirty=true;draw()}
// ---- candele per timeframe
function candles(){
  const tf=opt.tf,out=[];let j=lb(TR,v.t0-tf,t=>t[0]);let cur=null;
  for(;j<TR.length;j++){const t=TR[j];if(t[0]>v.t1)break;const k=Math.floor(t[0]/tf);
    if(!cur||cur.k!==k){cur={k,t:k*tf,tl:t[0],o:t[1],h:t[1],l:t[1],c:t[1],b:0,s:0};out.push(cur)}cur.tl=t[0];
    cur.h=Math.max(cur.h,t[1]);cur.l=Math.min(cur.l,t[1]);cur.c=t[1];t[3]>0?cur.b+=t[2]:cur.s+=t[2]}
  if(out.length&&S.length){const c=out[out.length-1];if(Math.floor(S[S.length-1].t/tf)===c.k)c.tl=Math.max(c.tl,S[S.length-1].t)}
  return out;
}
function renderBase(){
  const x=bx,w=mw(),h=pmain();
  x.fillStyle=BG();x.fillRect(0,0,W,H);
  x.save();x.beginPath();x.rect(0,0,w,h);x.clip();
  // heatmap
  const stp=stepNow(),sc=Math.pow(stp,.75);const lq=Math.log1p(QMAX/QREF);let i0=Math.max(0,lb(S,v.t0,s=>s.t)-1);
  for(let i=i0;i<S.length;i++){const s=S[i];if(s.t>v.t1)break;
    const xa=tx(s.t),xb=tx(i+1<S.length?S[i+1].t:s.t+500),ww=Math.max(1,xb-xa+.6);
    for(const k of agg(s.c,stp)){if(k[0]+stp<v.p0||k[0]>v.p1)continue;const idx=hv(Math.log1p(k[1]/sc/QREF)/lq);if(idx<=0)continue;
      const y1=py(k[0]+stp),y0=py(k[0]);x.fillStyle=PAL[idx];x.fillRect(xa,y1,ww,y0-y1+.6)}}
  // barre del libro "nel futuro" (libro dell'ultimo campione)
  if(S.length){const s=S[S.length-1],xf=tx(s.t)+2;if(xf<w){for(const k of agg(s.c,stp)){if(k[0]+stp<v.p0||k[0]>v.p1)continue;const idx=hv(Math.log1p(k[1]/sc/QREF)/lq);if(idx<=1)continue;
      const y1=py(k[0]+stp),y0=py(k[0]);x.fillStyle=PAL[idx];const hh=Math.max(1.5,y0-y1-1);x.fillRect(xf,y1+.5,w-xf,hh)}}
    x.strokeStyle="#ffffffcc";x.lineWidth=1;x.beginPath();x.moveTo(xf-2,0);x.lineTo(xf-2,h);x.stroke()}
  x.strokeStyle="rgba(255,255,255,.09)";x.lineWidth=1;if(stp*pmain()/(v.p1-v.p0)>=7)for(let p=Math.ceil(v.p0/stp)*stp;p<v.p1;p+=stp){const Y=Math.round(py(p))+.5;x.beginPath();x.moveTo(0,Y);x.lineTo(w,Y);x.stroke()}
  // griglia verticale ogni passo di tempo
  const tr=(v.t1-v.t0)/(W<640?4:8);const step=TST.find(a=>a>=tr)||TST[TST.length-1];
  x.setLineDash([3,4]);x.strokeStyle="#ffffff22";for(let t=Math.ceil(v.t0/step)*step;t<v.t1;t+=step){const X=tx(t);x.beginPath();x.moveTo(X,0);x.lineTo(X,h);x.stroke()}x.setLineDash([]);
  // candele
  const cs=candles();
  if(opt.candele){const cw=Math.max(2,Math.min(26,(tx(v.t0+opt.tf)-tx(v.t0))*.62));
    for(const c of cs){const X=tx(c.tl),up=c.c>=c.o,col=up?"#46d17b":"#e5605a";
      x.strokeStyle="#f2f5f8";x.lineWidth=1;x.beginPath();x.moveTo(X,py(c.h));x.lineTo(X,py(c.l));x.stroke();
      const yt=py(Math.max(c.o,c.c)),yb=py(Math.min(c.o,c.c));x.fillStyle=up?"rgba(70,209,123,.38)":"rgba(229,96,90,.42)";x.fillRect(X-cw/2,yt,cw,Math.max(1,yb-yt));x.strokeStyle="#f2f5f8";x.strokeRect(X-cw/2+.5,yt+.5,cw-1,Math.max(1,yb-yt)-1)}}
  // mid
  x.strokeStyle="#ffffff88";x.lineWidth=1;x.beginPath();let st=false;for(let i=i0;i<S.length;i++){const s=S[i];if(s.t>v.t1+2000)break;const X=tx(s.t),Y=py(s.mid);if(!st){x.moveTo(X,Y);st=true}else x.lineTo(X,Y)}x.stroke();
  // eventi
  for(const e of EV){const X=tx(e[0]);if(X<0||X>w)continue;x.strokeStyle="#ffd166";x.setLineDash([4,4]);x.beginPath();x.moveTo(X,0);x.lineTo(X,h);x.stroke();x.setLineDash([]);x.fillStyle="#ffd166";x.font="11px system-ui";x.fillText(e[1],Math.min(X+5,w-200),14)}
  // bolle raggruppate
  hit=[];
  if(opt.bolle){const GX=20,GY=16,cl=new Map();let j0=lb(TR,v.t0,t=>t[0]);
    for(let j=j0;j<TR.length;j++){const t=TR[j];if(t[0]>v.t1)break;if(t[1]<v.p0||t[1]>v.p1)continue;const X=tx(t[0]),Y=py(t[1]),key=Math.floor(X/GX)+"|"+Math.floor(Y/GY)+"|"+t[3];
      let c=cl.get(key);if(!c){c={q:0,qp:0,qt:0,n:0,s:t[3]};cl.set(key,c)}c.q+=t[2];c.qp+=t[2]*t[1];c.qt+=t[2]*t[0];c.n++}
    for(const c of cl.values()){if(c.q<=0)continue;const X=tx(c.qt/c.q),Y=py(c.qp/c.q),r=Math.min(38,2+3.4*Math.log1p(c.q/.03));
      x.fillStyle=c.s>0?"rgba(86,224,132,.42)":"rgba(240,98,92,.42)";x.strokeStyle=c.s>0?"#56e084":"#f0625c";x.lineWidth=c.n>1?1.5:1;x.beginPath();x.arc(X,Y,r,0,6.2832);x.fill();x.stroke();
      if(r>13){x.fillStyle="#fff";x.font="11px system-ui";x.textAlign="center";x.fillText(c.q>=10?c.q.toFixed(0):c.q.toFixed(1),X,Y+4);x.textAlign="left"}hit.push({x:X,y:Y,r,c})}}
  // istogramma volume sul fondo dell'area prezzo
  if(opt.volume&&cs.length){const mxv=Math.max(...cs.map(c=>c.b+c.s),1e-9),H0=L.VOL,cw=Math.max(2,(tx(v.t0+opt.tf)-tx(v.t0))*.8);
    for(const c of cs){const X=tx(c.tl),hb=c.b/mxv*H0,hs=c.s/mxv*H0;x.fillStyle="rgba(229,96,90,.75)";x.fillRect(X-cw/2,h-hs,cw,hs);x.fillStyle="rgba(70,209,123,.75)";x.fillRect(X-cw/2,h-hs-hb,cw,hb)}}
  x.restore();
  // asse prezzi + griglia
  x.fillStyle="#222a33";x.fillRect(w,0,L.AX,h);x.fillStyle="#c5d1de";x.font="13px system-ui";
  const ps=nice(v.p1-v.p0,10);for(let p=Math.ceil(v.p0/ps)*ps;p<v.p1;p+=ps){const Y=py(p);x.fillText(p.toFixed(ps<1?1:0),w+5,Y+5);x.strokeStyle="#ffffff0d";x.beginPath();x.moveTo(0,Y);x.lineTo(w,Y);x.stroke()}
  // SVP: profilo del volume di sessione (tutti i trade), acquisti e vendite
  x.save();x.beginPath();x.rect(w+L.AX+L.COB,0,L.SVP,h);x.clip();x.fillStyle="#1f262e";x.fillRect(w+L.AX+L.COB,0,L.SVP,h);
  const sv2=new Map();for(const [b,o] of svp){const nb=Math.floor(b/stp)*stp;let q=sv2.get(nb);if(!q){q={b:0,s:0};sv2.set(nb,q)}q.b+=o.b;q.s+=o.s}
  let mx=0,poc=-1,pm=0;for(const [b,o] of sv2){if(b+stp<v.p0||b>v.p1)continue;const t=o.b+o.s;if(t>mx)mx=t;if(t>pm){pm=t;poc=b}}
  const sx=w+L.AX+L.COB;
  if(L.SVP>0&&mx>0){for(const [b,o] of sv2){if(b+stp<v.p0||b>v.p1)continue;const y1=py(b+stp),y0=py(b),hh=Math.max(1,y0-y1-1),wb=o.b/mx*(L.SVP-4),ws=o.s/mx*(L.SVP-4);const xr=sx+L.SVP;x.fillStyle="rgba(229,96,90,.9)";x.fillRect(xr-ws,y1,ws,hh);x.fillStyle="rgba(70,209,123,.9)";x.fillRect(xr-ws-wb,y1,wb,hh)}
    if(poc>=0){x.strokeStyle="#ffd166";x.beginPath();x.moveTo(sx,py(poc+stp/2));x.lineTo(sx+L.SVP,py(poc+stp/2));x.stroke()}}
  x.restore();x.fillStyle="#9fb0c2";x.font="10px system-ui";if(L.SVP>=80)x.fillText("PROFILO",sx+4,10);
  // CVD
  const cy0=h,ch=L.CVD;x.fillStyle="#1d242b";x.fillRect(0,cy0,w,ch);
  const k0=Math.max(0,lb(TR,v.t0,t=>t[0])-1);let lo=1e18,hi=-1e18,k1=k0;for(let j=k0;j<TR.length&&TR[j][0]<=v.t1;j++){lo=Math.min(lo,CV[j]);hi=Math.max(hi,CV[j]);k1=j}
  if(hi>=lo){lo=Math.min(lo,0);hi=Math.max(hi,0);if(hi-lo<1e-6)hi=lo+1;const yv=a=>cy0+ch-8-(a-lo)/(hi-lo)*(ch-16);
    x.strokeStyle="#ffffff14";x.lineWidth=1;for(let g=0;g<=4;g++){const Y=cy0+8+g*(ch-16)/4;x.beginPath();x.moveTo(0,Y);x.lineTo(w,Y);x.stroke()}
    x.strokeStyle="#000";x.beginPath();x.moveTo(0,yv(0));x.lineTo(w,yv(0));x.stroke();
    x.save();x.beginPath();x.rect(0,cy0,w,ch);x.clip();x.lineWidth=1.4;let prevUp=null;x.beginPath();
    for(let j=k0;j<=k1;j++){const X=tx(TR[j][0]),Y=yv(CV[j]),up=CV[j]>=0;if(prevUp===null){x.moveTo(X,Y)}else if(up!==prevUp){x.strokeStyle=prevUp?"#46d17b":"#e5605a";x.stroke();x.beginPath();x.moveTo(X,Y)}else x.lineTo(X,Y);prevUp=up}

    return"mid "+f1(mid)+"; liquidità entro 30$: bid "+f1(bq)+" BTC, ask "+f1(aq)+" BTC (sbilanciamento bid/(bid+ask) "+(bq+aq>0?(100*bq/(bq+aq)).toFixed(0):"-")+"%); livelli più grossi entro 60$: "+(cs.length?cs.map(k=>(k[2]?"ask ":"bid ")+k[0]+" ("+f1(k[1])+" BTC)").join(", "):"nessuno")};
  if(S.length){Ls.push("Libro all'inizio finestra: "+walls(S[iA]));Ls.push("Libro alla fine finestra:  "+walls(S[iB]));
    const fin=new Set(S[iB].c.map(k=>k[0]+"|"+k[2])),gone=S[iA].c.filter(k=>k[1]>=5&&Math.abs(k[0]-S[iA].mid)<=60&&!fin.has(k[0]+"|"+k[2]));
    if(gone.length)Ls.push("Livelli ≥5 BTC presenti all'inizio e non più presenti alla fine (consumati o ritirati, non distinguibili da qui): "+gone.slice(0,6).map(k=>(k[2]?"ask ":"bid ")+k[0]+" ("+f1(k[1])+" BTC)").join(", "))}
  const bub=hit.map(o=>o.c).sort((a,b)=>b.q-a.q).slice(0,8);if(bub.length)Ls.push("Bolle più grosse visibili (raggruppate allo zoom corrente): "+bub.map(c=>fmtT(c.qt/c.q,true)+" "+f1(c.qp/c.q)+" "+(c.s>0?"acquisto":"vendita")+" "+f2(c.q)+" BTC ("+c.n+" trade)").join(" ; "));
  const bins=new Map();for(const t of tr){const b=Math.floor(t[1]);bins.set(b,(bins.get(b)||0)+t[2])}let poc=null,pm=0;for(const [b,q] of bins)if(q>pm){pm=q;poc=b}
  if(poc!==null)Ls.push("POC della finestra (livello con più volume scambiato): "+poc+" ("+f2(pm)+" BTC)");
  if(j1>j0)Ls.push("CVD: da "+f2(CV[j0])+" a "+f2(CV[j1-1])+" BTC (variazione "+f2(CV[j1-1]-CV[j0])+")");
  const cs=candles();if(cs.length){const c0=cs[0],c1=cs[cs.length-1];Ls.push("Candele "+(opt.tf/1000)+" s nella finestra: "+cs.length+"; prima open "+f1(c0.o)+", ultima close "+f1(c1.c)+"; massimo "+f1(Math.max(...cs.map(c=>c.h)))+", minimo "+f1(Math.min(...cs.map(c=>c.l))))}
  const ev=EV.filter(e=>e[0]>=v.t0&&e[0]<=v.t1);if(ev.length)Ls.push("Eventi segnalati nella finestra: "+ev.map(e=>fmtT(e[0],true)+" "+e[1]).join(" ; "));
  Ls.push("Nota: dati del solo libro/trade Kraken spot; nessun attore identificabile; condizioni di vantaggio temporaneo ≠ edge statistico (le definizioni congelate sono nei protocolli v34–v35).");
  return Ls.join("\n")}
